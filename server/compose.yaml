# Starts the self hosted sync server. Put TABLODGE_SYNC_TOKEN in a .env file next to this one
# (generate it with `openssl rand -base64 32`), then run `docker compose up -d`.
# See docs/self-hosting.md.
services:
  sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: tablodge-sync
    restart: unless-stopped
    environment:
      TABLODGE_SYNC_TOKEN: ${TABLODGE_SYNC_TOKEN:?Set TABLODGE_SYNC_TOKEN in .env}
    ports:
      - "8787:8787"
    volumes:
      - tablodge-sync:/data
    # One library at idle uses about 20 MB and well under 1% of a core; these limits leave room for a large first sync.
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

volumes:
  tablodge-sync:
