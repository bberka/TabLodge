name: Test

# Runs on every push to the main branch and on pull requests. Independent jobs run in parallel: lint (three file
# shards), typecheck and tests; extension build, package and Firefox smoke check; the accessibility check (four shards);
# the startup and dev browser checks; the private storage check; the Cloudflare Worker bundle freshness check; and the
# Android bundle. The slowest job sets the wall clock, so split a job before it becomes the longest one.
# On pull requests the changes job lists the touched files and skips the jobs they cannot affect; pushes to the main
# branch always run everything. A skipped job counts as passed in the gate job at the bottom.
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a pull request needs from the files it touches. A path this job does not know turns every job on,
  # so a new top level folder is checked in full until it gets a rule here.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      core: ${{ steps.scope.outputs.core }}
      browser: ${{ steps.scope.outputs.browser }}
      cloudflare: ${{ steps.scope.outputs.cloudflare }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          core=false browser=false cloudflare=false mobile=false
          if [ "$EVENT" != pull_request ]; then
            core=true browser=true cloudflare=true mobile=true
          else
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')"
            echo "$files"
            while IFS= read -r file; do
              case "$file" in
                '') ;;
                # Nothing in these runs through a job below (the website has its own workflow).
                docs/*|*.md|LICENSE|apps/site/*|.github/ISSUE_TEMPLATE/*) ;;
                apps/mobile/*) core=true mobile=true ;;
                apps/server/*) core=true cloudflare=true ;;
                apps/extension/src/shared/*) core=true browser=true cloudflare=true mobile=true ;;
                apps/extension/*) core=true browser=true ;;
                *) core=true browser=true cloudflare=true mobile=true ;;
              esac
            done <<< "$files"
          fi
          {
            echo "core=$core"
            echo "browser=$browser"
            echo "cloudflare=$cloudflare"
            echo "mobile=$mobile"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # XO's cold start is about 8 seconds and the rest scales with files, so three file groups finish in about
      # 20 seconds each where one run takes about 50. Keep every tracked source file in exactly one group.
      matrix:
        include:
          - name: extension app
            paths: "apps/extension/src/**"
          - name: mobile app
            paths: "apps/mobile/**"
          - name: scripts, tests, server
            paths: "apps/extension/scripts/** apps/extension/tests/** apps/extension/shell/** apps/extension/*.ts apps/extension/*.cjs apps/server/**/*.ts scripts/** tsconfig/** *.ts package.json"
    steps:
      - uses: actions/checkout@v7
      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec xo ${{ matrix.paths }}

  # A pull request may not add comments or leave a file's baseline stale (docs/agents/comments.md). It needs history for
  # the merge base, and it runs for every change, including the docs and website changes that skip the other jobs.
  comments:
    needs: changes
    name: Comment ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/comment-ratchet.ts --base "$(git merge-base HEAD "$BASE")"
      - if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/comment-ratchet.ts --base HEAD^

  typecheck:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsgo -b

  unit:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp test run

  extension:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Build, package, Firefox smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run build
      - run: pnpm exec vp run pack
      # Installs the Firefox package in the runner's Firefox and runs the core workflows.
      - run: pnpm exec vp run check:firefox

  # The accessibility check is the slowest, so its checks are split across four jobs (A11Y_SHARD, see harness.ts).
  a11y:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Accessibility check (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec vp run browser:install
      - run: pnpm exec vp run build
      - run: pnpm exec vp run check:a11y
        env:
          A11Y_SHARD: ${{ matrix.shard }}/4

  browser:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Startup and dev browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec vp run browser:install
      - run: pnpm exec vp run build
      - run: pnpm exec vp run check:startup
      - run: pnpm exec vp run check:dev-browser

  # One long scenario (enable private access, restart the browser), so it cannot be sharded; its own job keeps it off
  # the other browser checks' critical path.
  private-storage:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Private storage check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec vp run browser:install
      - run: pnpm exec vp run build
      - run: pnpm exec vp run check:private-storage

  # Fails when the committed Worker for the Deploy to Cloudflare button differs from what cf:bundle builds.
  cloudflare:
    needs: changes
    if: ${{ needs.changes.outputs.cloudflare == 'true' }}
    name: Cloudflare Worker bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run cf:bundle
      - run: git diff --exit-code -- apps/server/cloudflare-deploy

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    name: Bundle Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bundles the Android app's JavaScript with Metro; no Android SDK is needed. It first lists the licences of every
      # package in the bundle (scripts/licences.mts), and fails when one has no licence id or text.
      - run: pnpm run mobile:export

  # The branch ruleset requires this check name. It passes only when every job above passes.
  test:
    name: Lint, typecheck, test, build, package, Firefox smoke check
    needs: [changes, lint, comments, typecheck, unit, extension, a11y, browser, private-storage, cloudflare, mobile]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # A job skipped by the changes job counts as passed; a failed or cancelled one does not.
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          test "$CHANGES" = success
          echo "$RESULTS"
          ! echo "$RESULTS" | grep -Eq 'failure|cancelled'
