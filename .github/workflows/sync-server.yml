name: Sync server image

# Builds the self hosted sync server image (server/Dockerfile) for amd64 and arm64.
# Pull requests only build it. A push to master publishes ghcr.io/<owner>/tablodge-sync:edge. Each TabLodge release
# (release.yml) calls this workflow with its version, which publishes :<version> and :latest. See
# docs/self-hosting.md.
on:
  push:
    branches: [master]
    paths:
      - server/**
      - src/shared/sync/**
      - src/shared/library-*.ts
      - src/app/types.ts
      - pnpm-lock.yaml
      - .github/workflows/sync-server.yml
  pull_request:
    paths:
      - server/**
      - src/shared/sync/**
      - src/shared/library-*.ts
      - src/app/types.ts
      - pnpm-lock.yaml
      - .github/workflows/sync-server.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The TabLodge release version, such as 0.1.9
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # A release gets its own group, so a master push at the same moment cannot cancel it.
  group: sync-server-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish the sync server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tablodge-sync
          tags: |
            type=edge,branch=master,enable=${{ !inputs.version }}
            type=raw,value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=latest,enable=${{ !!inputs.version }}
          labels: |
            org.opencontainers.image.title=TabLodge sync server
            org.opencontainers.image.description=Self hosted sync server for the TabLodge browser extension
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
