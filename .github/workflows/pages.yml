name: Website

# Builds the Astro site in apps/site/ and deploys it to GitHub Pages (https://tablodge.bbay.dev).
# The site version comes from the latest GitHub release. Release workflow dispatches a build after publishing.
# Pull requests only build the site, so a broken site fails the PR. Only master, dispatch, and manual runs deploy.
# One-time setup: repository Settings > Pages > Source: GitHub Actions (see docs/agents/site.md).
on:
  push:
    branches: [master]
    paths:
      - 'apps/site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages.yml'
  # No paths filter here, so the required "Build site" check always reports on pull requests.
  pull_request:
  repository_dispatch:
    types: [tablodge-release-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve latest release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          version="$RELEASE_VERSION"
          if [ -z "$version" ]; then
            version="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            version="$(node -p "require('./apps/extension/shell/manifest.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm exec vp run site:build
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
