name: Release

# Manual only: Actions → Release → Run workflow (on master).
# Version = 0.<VERSION file>.<patch>, where patch continues from the latest v0.<VERSION>.* tag
# (see scripts/release-version.ts). Publishes a GitHub release with an unpacked-extension zip.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Compute version
        id: version
        run: |
          version="$(node scripts/release-version.ts next)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists." && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-version.ts set "$VERSION"

      - run: pnpm check
      - run: pnpm build

      - name: Package unpacked extension
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out_dir="$(dirname "$(ls dist/*/manifest.json | head -n 1)")"
          name="$(node -p "require('./package.json').name")"
          zip_path="release/$name-$VERSION.zip"
          mkdir -p release
          (cd "$out_dir" && zip -r -X -9 "$GITHUB_WORKSPACE/$zip_path" .)
          (cd release && sha256sum "$(basename "$zip_path")" > "$(basename "$zip_path").sha256")
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          app_name="$(node -p "require('./extension/manifest.json').short_name")"
          zip_file="$(basename "$ZIP")"
          cat > release/notes.md <<EOF
          ## Install

          1. Download **$zip_file** below and unzip it into a folder you will keep (the browser loads the extension from it).
          2. Open your browser's extensions page (\`chrome://extensions\`, \`brave://extensions\`, \`edge://extensions\`, …) and turn on **Developer mode**.
          3. Click **Load unpacked** and select the unzipped folder (the one containing \`manifest.json\`).

          To update, replace the folder's contents with the new release and click the reload button on the extension's card. Keep the same folder so your saved data stays with the extension.
          EOF
          gh release create "v$VERSION" "$ZIP" "$ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "$app_name v$VERSION" \
            --notes-file release/notes.md \
            --generate-notes
