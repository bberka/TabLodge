name: Release

# Manual only: Actions → Release → Run workflow (on the default branch).
# Version = 0.<VERSION file>.<patch>, where patch continues from the latest v0.<VERSION>.* tag
# (see scripts/release-version.ts). Publishes a GitHub release with a Chromium zip and a Firefox zip, then the sync
# server image with the same version (sync-server.yml) and the signed Android APK. The APK needs the signing secrets
# described in docs/CONTRIBUTING.md; without them that job only prints a warning.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release zips
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Compute version
        id: version
        run: |
          version="$(node scripts/release-version.ts next)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists." && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-version.ts set "$VERSION"

      - run: pnpm exec vp run check
      - run: pnpm exec vp run build

      - name: Package unpacked extensions
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec vp run pack
          name="$(node -p "require('./package.json').name")"
          zip_path="release/$name-$VERSION.zip"
          firefox_zip_path="release/$name-$VERSION-firefox.zip"
          test -f "$zip_path"
          test -f "$firefox_zip_path"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=$firefox_zip_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          FIREFOX_ZIP: ${{ steps.package.outputs.firefox_zip }}
        run: |
          app_name="$(node -p "require('./apps/extension/shell/manifest.json').short_name")"
          zip_file="$(basename "$ZIP")"
          firefox_zip_file="$(basename "$FIREFOX_ZIP")"
          cat > release/notes.md <<EOF
          ## Install

          ### Chromium browsers (Chrome, Brave, Edge, Vivaldi, Opera)

          1. Download **$zip_file** below and unzip it into a folder you will keep (the browser loads the extension from it).
          2. Open your browser's extensions page (\`chrome://extensions\`, \`brave://extensions\`, \`edge://extensions\`, …) and turn on **Developer mode**.
          3. Click **Load unpacked** and select the unzipped folder (the one containing \`manifest.json\`).

          To update, replace the folder's contents with the new release and click the reload button on the extension's card. Keep the same folder so your saved data stays with the extension.

          ### Firefox 140 or newer (desktop)

          Install TabLodge from [Firefox Add-ons](https://addons.mozilla.org/firefox/addon/tab-lodge/). It updates itself.

          To load a package by hand instead, **$firefox_zip_file** is unsigned. To try it, open \`about:debugging#/runtime/this-firefox\`, click **Load Temporary Add-on**, and select the ZIP; Firefox removes it when it restarts. Firefox ESR, Developer Edition, Nightly, and unbranded builds can keep it installed after you set \`xpinstall.signatures.required\` to \`false\` in \`about:config\`. See the README for the differences from the Chromium version.

          ### Android 7 or newer

          Download **tablodge.apk** below, open it on your phone, and allow your browser or file manager to install apps when Android asks. It saves links and shows your bookmarks and sessions from your sync server. To update, install the next release's APK over it. Check the download against \`tablodge.apk.sha256\`. It is attached a few minutes after the release, once it has been built and signed.
          EOF
          gh release create "v$VERSION" "$ZIP" "$ZIP.sha256" "$FIREFOX_ZIP" "$FIREFOX_ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "$app_name v$VERSION" \
            --notes-file release/notes.md \
            --generate-notes

      - name: Trigger website deployment
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            --method POST \
            -f event_type=tablodge-release-published \
            -F "client_payload[version]=$VERSION"

  image:
    name: Publish the sync server image
    needs: release
    uses: ./.github/workflows/sync-server.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write

  android:
    name: Build and attach the signed Android APK
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      # The release key, created once as described in docs/CONTRIBUTING.md.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check the signing secrets
        id: signing
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The Android signing secrets are not set, so v$VERSION has no APK. See docs/CONTRIBUTING.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      # The tag the release job made, so the APK is built from exactly the released commit.
      - uses: actions/checkout@v7
        if: steps.signing.outputs.enabled == 'true'
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: pnpm/action-setup@v6
        if: steps.signing.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.signing.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        if: steps.signing.outputs.enabled == 'true'
      - uses: gradle/actions/setup-gradle@v5
        if: steps.signing.outputs.enabled == 'true'
      - name: Install and stamp the version
        if: steps.signing.outputs.enabled == 'true'
        run: |
          pnpm install --frozen-lockfile
          node scripts/release-version.ts set-android "$VERSION"
      - name: Generate the Android project
        if: steps.signing.outputs.enabled == 'true'
        run: pnpm --filter tablodge-mobile exec expo prebuild --platform android --no-install
      - name: Build the release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -x lint -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      # Gradle signs the release build with a throwaway debug key. This aligns it and signs it again with the real one.
      - name: Sign, check, and upload the APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir release
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/zipalign" -f -p 4 apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out release/tablodge.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          "$tools/apksigner" verify --print-certs release/tablodge.apk
          (cd release && sha256sum tablodge.apk > tablodge.apk.sha256)
          gh release upload "v$VERSION" release/tablodge.apk release/tablodge.apk.sha256
