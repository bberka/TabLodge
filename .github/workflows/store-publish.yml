name: Store publishing

# The release workflow sends this dispatch after publishing the GitHub release.
# Manual runs can retry one store, or both, for an existing v0.x.y release.
# A schedule retries the latest release for any store that has not accepted it yet,
# for example while Chrome still has an earlier version in review.
on:
  repository_dispatch:
    types: [tablodge-release-published]
  workflow_dispatch:
    inputs:
      version:
        description: GitHub release version to submit, for example 0.2.1
        required: true
        type: string
      store:
        description: Store to submit to
        required: true
        default: all
        type: choice
        options: [all, chrome, firefox]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

jobs:
  version:
    name: Resolve release version
    if: github.repository == 'bberka/TabLodge'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      chrome: ${{ steps.release.outputs.chrome }}
      firefox: ${{ steps.release.outputs.firefox }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
          MANUAL_STORE: ${{ github.event.inputs.store }}
          # A scheduled run stops retrying a release after this many days.
          RETRY_DAYS: 7
        run: |
          set -euo pipefail
          chrome=false
          firefox=false
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            latest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 \
              --json tagName,publishedAt --jq '.[0] | "\(.tagName) \(.publishedAt)"')"
            read -r tag published <<< "$latest"
            version="${tag#v}"
            if (( $(date +%s) - $(date -d "$published" +%s) > RETRY_DAYS * 86400 )); then
              echo "Release $tag is older than $RETRY_DAYS days; nothing to retry."
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "chrome=false" >> "$GITHUB_OUTPUT"
              echo "firefox=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A store is done once a run reached its "accepted" step for this version.
            accepted() {
              local job="$1" step="$2" id
              for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/store-publish.yml/runs?created=>=$published&per_page=100" \
                --jq '.workflow_runs[].id'); do
                if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                  --jq ".jobs[] | select(.name == \"$job\") | .steps[] | select(.name == \"$step\" and .conclusion == \"success\")" \
                  | grep -q .; then
                  return 0
                fi
              done
              return 1
            }
            accepted "Submit v$version to Chrome Web Store" "Chrome accepted the package" || chrome=true
            accepted "Submit v$version to Firefox Add-ons" "Firefox accepted the package" || firefox=true
          else
            version="${DISPATCH_VERSION:-$MANUAL_VERSION}"
            version="${version#v}"
            if [[ ! "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Expected a release version like 0.2.1."
              exit 1
            fi
            store="${MANUAL_STORE:-all}"
            [[ "$store" != firefox ]] && chrome=true
            [[ "$store" != chrome ]] && firefox=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chrome=$chrome" >> "$GITHUB_OUTPUT"
          echo "firefox=$firefox" >> "$GITHUB_OUTPUT"

  chrome:
    name: Submit v${{ needs.version.outputs.version }} to Chrome Web Store
    needs: version
    if: needs.version.outputs.chrome == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: chrome-web-store-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Download and verify GitHub release package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "tablodge-$VERSION.zip*" \
            --dir release
          zip="release/tablodge-$VERSION.zip"
          checksum="release/tablodge-$VERSION.zip.sha256"
          test -s "$zip"
          test -s "$checksum"
          (cd release && sha256sum --check "tablodge-$VERSION.zip.sha256")

      - name: Upload and submit package to Chrome Web Store
        id: chrome-upload
        env:
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ekidoclgpdfhpdlidlkcjccgihbndoib
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          zip="release/tablodge-$VERSION.zip"
          # An earlier version still in review blocks the upload. That is not a failure:
          # the step below stays skipped, so the next scheduled run tries again.
          if npm exec --yes --package=chrome-webstore-upload-cli@4.0.2 -- \
            chrome-webstore-upload \
            --source "$zip" \
            --max-await-in-progress 300 2>&1 | tee upload.log; then
            echo "accepted=true" >> "$GITHUB_OUTPUT"
          elif grep -q "in review" upload.log; then
            echo "::warning::Chrome Web Store has a version in review. The scheduled retry will submit v$VERSION later."
          else
            exit 1
          fi

      - name: Chrome accepted the package
        if: steps.chrome-upload.outputs.accepted == 'true'
        run: echo "Submitted to the Chrome Web Store."

  firefox:
    name: Submit v${{ needs.version.outputs.version }} to Firefox Add-ons
    needs: version
    if: needs.version.outputs.firefox == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: firefox-addons-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      # AMO requires the source of bundled and minified code. The tag is the release source.
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download and verify GitHub release package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "tablodge-$VERSION-firefox.zip*" \
            --dir release
          (cd release && sha256sum --check "tablodge-$VERSION-firefox.zip.sha256")
          mkdir -p release/package
          unzip -q "release/tablodge-$VERSION-firefox.zip" -d release/package
          test -s release/package/manifest.json

      - name: Package the source code
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: git archive --format=zip -o "release/tablodge-$VERSION-source.zip" "v$VERSION"

      # Submits the version to the listed channel and returns once it is queued, not after review.
      - name: Submit package and source to Firefox Add-ons
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          npm exec --yes --package=web-ext@10.8.0 -- \
            web-ext sign \
            --channel=listed \
            --source-dir release/package \
            --artifacts-dir release/artifacts \
            --upload-source-code "release/tablodge-$VERSION-source.zip" \
            --approval-timeout=0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Firefox accepted the package
        run: echo "Submitted to Firefox Add-ons."
