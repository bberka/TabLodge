<!doctype html>
<!-- A trimmed letterboxd.com film page with a row of posters: the page's watchlist control is labelled "Add this film
to your watchlist" (or "This film is in your watchlist"); a poster names its film in data-item-link and
data-item-name, and its menu opens outside it. Hand written from the logged-out page, not a capture. -->
<html lang="en">
<head><meta charset="utf-8"><title>Letterboxd</title></head>
<body>
	<h1 class="headline-1">Parasite</h1>
	<a href="#" class="action -watchlist" id="page-add" aria-label="Add this film to your watchlist"><span>Watchlist</span></a>
	<a href="#" class="action -watchlist" id="page-remove" aria-label="This film is in your watchlist"><span>Watchlist</span></a>
	<ul>
		<li><div data-component-class="LazyPoster" data-item-link="/film/memories-of-murder/" data-item-name="Memories of Murder (2003)" data-in-watchlist="false" id="poster"><img alt="Memories of Murder" id="poster-image"></div></li>
		<li><div data-component-class="LazyPoster" data-item-link="/film/mother-2009/" data-item-name="Mother (2009)" id="poster-two"></div></li>
	</ul>
	<div class="poster-popmenu">
		<ul>
			<li><a href="#" id="menu-add">Add to watchlist</a></li>
			<li><a href="#" id="menu-remove">Remove from watchlist</a></li>
		</ul>
	</div>
</body>
</html>
