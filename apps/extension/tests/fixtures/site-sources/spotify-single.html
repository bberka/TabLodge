<!doctype html>
<!-- A trimmed open.spotify.com page for an album of one song: the header's save button and the only track row share
a container, which the reader must not take for a card about that song. Hand written, not a capture. -->
<html lang="en">
<head><meta charset="utf-8"><title>Spotify</title></head>
<body>
	<main>
		<section>
			<h1>One Song Album</h1>
			<div><button data-testid="add-button" id="album-save" aria-checked="false"></button></div>
			<a href="/track/0aBcDeFgHiJkLmNoPqRsTu">The only song</a>
		</section>
	</main>
</body>
</html>
