<!doctype html>
<!-- github.com/stars and github.com/stars/<login>, reduced by hand from a real signed-in page (2026-11): the signed-in login
in a meta tag and ul.repo-list rows. Repositories and logins swapped for public ones. -->
<html lang="en">
<head><meta charset="utf-8"><meta name="user-login" content="octo-me"><title>Your stars</title></head>
<body>
<main>
	<div class="col-md-3" role="complementary" aria-label="Star filters"><ul class="filter-list"><li><a href="/stars/octo-me" class="filter-item selected">All stars</a></li></ul><h3 class="h4 mb-2">Filter by languages</h3></div>
	<div class="col-md-9">
		<h2 class="h5 mt-2 text-uppercase border-bottom pb-2">Starred Repositories</h2>
		<ul class="repo-list list-style-none js-navigation-container">
			<li class="tmp-py-4 border-bottom public source">
				<div class="d-inline-block mb-1"><h3><a href="/nodejs/node"><span class="text-normal">nodejs / </span> node </a></h3></div>
				<div class="float-right d-flex"><div class="js-toggler-container js-social-container starring-container starring-container--with-list-menu on d-flex"><div class="starred BtnGroup"><form class="js-social-form" action="/nodejs/node/unstar" method="post"><button type="submit" class="btn-sm btn"> Starred </button></form></div><dialog><p class="blankslate-description"> </p></dialog></div></div>
				<div class="py-1"><p class="col-9 d-inline-block color-fg-muted m-0 tmp-pr-4"> Node.js JavaScript runtime </p></div>
			</li>
		</ul>
	</div>
</main>
</body>
</html>
