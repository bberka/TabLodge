packages:
  - .
  - site
  - server
allowBuilds:
  esbuild: true
  # wrangler's local runtime downloads its platform binary on install.
  workerd: true
  # Prebuilt binaries come from optional dependencies; its postinstall check isn't needed.
  unrs-resolver: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
